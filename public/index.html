<!DOCTYPE html>
<html lang="es-MX" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexGym Cloud MX | BDKGYM en la Nube — SaaS con CFDI 4.0 y Módulos Integrados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    @media print {
      body * { visibility: hidden; }
      #printable-ticket, #printable-ticket * { visibility: visible; }
      #printable-ticket { position: absolute; left: 0; top: 0; width: 80mm; background: white !important; color: black !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-x-hidden overflow-y-auto">

  <!-- 0. PUBLIC SAAS LANDING PAGE (PÁGINA COMERCIAL PARA CLIENTES QUE COMPRAN EL SAAS) -->
  <div id="landing-screen" class="min-h-screen flex-col bg-slate-950" style="display: flex;">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- 1. LOGIN SCREEN (SOLO FORMULARIO LIMPIO DE ACCESO) -->
  <div id="login-screen" class="min-h-screen items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950/50 via-slate-950 to-slate-950" style="display: none;">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- 2. SUPERADMIN MASTER CONSOLE (OCULTO AL PÚBLICO — SOLO ACCESIBLE CON TU LOGIN PRIVADO) -->
  <div id="superadmin-screen" class="min-h-screen flex-col bg-slate-950" style="display: none;">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- 3. GYM OPERATIONAL WORKSPACE (VISTA DEL GIMNASIO) -->
  <div id="gym-workspace" class="flex-col min-h-screen" style="display: none;">
  <!-- TOP BAR: SaaS Plan Switcher & Local Bridge Status -->
  <header class="sticky top-0 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 z-30">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-dumbbell text-slate-950 text-lg"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold tracking-tight text-white text-base">NexGym Cloud <span class="text-emerald-400">MX</span></span>
          <span id="role-badge-header" class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">Sistema Activo</span>
        </div>
        <div class="text-xs text-slate-400 flex items-center gap-2">
          <span id="header-gym-name">Titanes Fitness & Studio MX</span>
          <span>•</span>
          <select id="branch-selector" onchange="window.app.changeBranch(this.value)" class="bg-slate-800 text-slate-200 text-xs rounded px-2 py-0.5 border border-slate-700 focus:outline-none">
          </select>
        </div>
      </div>
    </div>

    <!-- Hardware Bridge & Offline Status -->
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Botón para volver a la Consola SuperAdmin (OCULTO para dueños de gym; solo visible cuando entras con tu cuenta SuperAdmin) -->
      <button onclick="window.app.openSuperAdmin()" id="btn-go-superadmin" class="hidden px-3 py-1.5 rounded-lg text-xs font-extrabold bg-gradient-to-r from-purple-600 to-indigo-600 text-white hover:opacity-95 transition shadow-md shadow-purple-500/20 items-center gap-1.5">
        <i class="fa-solid fa-crown text-amber-300"></i>
        <span>Volver a Mi SuperAdmin</span>
      </button>

      <button onclick="window.app.toggleOfflineSimulation()" id="btn-offline-sim" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium border transition bg-slate-800/90 border-slate-700 text-slate-300 hover:bg-slate-800" title="Estado del puente con torniquete y caché local">
        <span id="offline-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="offline-label">Bridge: Online</span>
      </button>

      <!-- Quick SaaS Plan Switcher (Oculto para dueños normales; visible solo para SuperAdmin) -->
      <div id="header-plan-switcher" class="hidden items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button onclick="window.app.switchPlan('basico')" id="plan-btn-basico" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition">
          Básico $599
        </button>
        <button onclick="window.app.switchPlan('pro')" id="plan-btn-pro" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition">
          Pro $1,199
        </button>
        <button onclick="window.app.switchPlan('boutique')" id="plan-btn-boutique" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition">
          Boutique $2,499
        </button>
      </div>

      <button onclick="window.app.navigate('saas-modules')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 hover:opacity-95 transition shadow-md shadow-amber-500/10 flex items-center gap-1.5">
        <i class="fa-solid fa-puzzle-piece"></i>
        <span>Mi Plan y Módulos (<span id="header-mrr-price">$599</span>/mes)</span>
      </button>

      <button onclick="window.app.logout()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-rose-500/20 text-slate-300 hover:text-rose-300 border border-slate-700 transition flex items-center gap-1.5" title="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex flex-1 items-start">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 sticky top-[57px] h-[calc(100vh-57px)] overflow-y-auto">
      <div class="p-3 space-y-1">
        <div class="px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-500">Base Operativa ($599/mes)</div>

        <button onclick="window.app.navigate('dashboard')" data-nav="dashboard" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-chart-pie w-4 text-center"></i> Dashboard & KPIs</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">Base</span>
        </button>

        <button onclick="window.app.navigate('pos')" data-nav="pos" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-cash-register w-4 text-center"></i> Recepción POS & Caja</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">Base</span>
        </button>

        <button onclick="window.app.navigate('members')" data-nav="members" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-users w-4 text-center"></i> Socios & WhatsApp</span>
          <span id="nav-members-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">6/150</span>
        </button>

        <button onclick="window.app.navigate('access')" data-nav="access" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-qrcode w-4 text-center"></i> Check-In & Torniquete</span>
          <span id="badge-biometrics" class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">QR</span>
        </button>

        <button onclick="window.app.navigate('cfdi')" data-nav="cfdi" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-file-invoice-dollar w-4 text-center"></i> Facturación CFDI 4.0</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">SAT</span>
        </button>

        <div class="pt-3 px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-500">Módulos Pro ($1,199 o Add-on)</div>

        <button onclick="window.app.navigate('domiciliacion')" data-nav="domiciliacion" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-credit-card w-4 text-center"></i> Domiciliación Stripe</span>
          <span id="lock-domiciliacion" class="text-[10px] px-1.5 py-0.5 rounded"></span>
        </button>

        <button onclick="window.app.navigate('routines')" data-nav="routines" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-mobile-screen-button w-4 text-center"></i> App Socio & Rutinas</span>
          <span id="lock-routinesApp" class="text-[10px] px-1.5 py-0.5 rounded"></span>
        </button>

        <div class="pt-3 px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-500">Boutique & IA ($2,499 o Add-on)</div>

        <button onclick="window.app.navigate('boutique')" data-nav="boutique" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-calendar-check w-4 text-center"></i> Mapa Bicis / Reformers</span>
          <span id="lock-boutiqueMap" class="text-[10px] px-1.5 py-0.5 rounded"></span>
        </button>

        <button onclick="window.app.navigate('whatsapp-ai')" data-nav="whatsapp-ai" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-brands fa-whatsapp w-4 text-center"></i> Recepcionista IA 24/7</span>
          <span id="lock-whatsappAi" class="text-[10px] px-1.5 py-0.5 rounded"></span>
        </button>

        <div class="pt-3 px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-amber-400/90">Suscripción y Add-Ons</div>

        <button onclick="window.app.navigate('saas-modules')" data-nav="saas-modules" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3"><i class="fa-solid fa-puzzle-piece w-4 text-center text-amber-400"></i> Mi Plan y Módulos</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">Add-ons</span>
        </button>
      </div>

      <!-- Bottom Card: Local Hardware Bridge Status -->
      <div class="p-3 m-3 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1.5">
        <div class="flex items-center justify-between font-semibold text-slate-300">
          <span><i class="fa-solid fa-microchip text-emerald-400 mr-1"></i> Bridge Torniquete</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">Activo</span>
        </div>
        <div class="text-[11px] text-slate-400 leading-tight">ZKTeco Huella + Hikvision Facial sincronizados en caché local.</div>
      </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="main-view" class="flex-1 min-w-0 p-6 pb-20 bg-slate-950">
      <!-- Dynamic views rendered by app.js -->
    </main>
  </div>
  </div><!-- /#gym-workspace -->

  <!-- MODAL FOR UPSELL / LOCKED MODULES & TICKET PRINTING -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div id="modal-content" class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl my-auto"></div>
  </div>

  <script src="/app.js?v=20261031-4"></script>
</body>
</html>
